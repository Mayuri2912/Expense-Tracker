<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker - Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body{
    background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
    min-height: 100vh;
}
.login-box{
    width:400px;
    margin:100px auto;
    padding:35px;
    background:white;
    border-radius:16px;
    box-shadow:0 1rem 3rem rgba(0,0,0,.25);
}
</style>
</head>

<body>

<div class="login-box">

<div class="text-center mb-4">
    <i class="bi bi-key fs-1 text-primary"></i>
    <h2 class="mt-2">Forgot Password</h2>
    <p class="text-muted">Enter your email to receive a one-time password (OTP)</p>
</div>

<div th:if="${error}" class="alert alert-danger py-2">
    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
</div>

<form action="/forgot-password" method="post">

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" placeholder="Enter your registered email" required autofocus>
</div>

<button type="submit" class="btn btn-primary w-100">
<i class="bi bi-send me-1"></i> Send OTP
</button>

</form>

<br>

<p class="text-center mb-0">
Remembered your password?
<a href="/login">Back to Login</a>
</p>

</div>

</body>
</html>
