<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Add Category</title>
<th:block th:insert="~{fragments/layout :: headAssets}"></th:block>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <div th:replace="~{fragments/layout :: sidebar(active='add-category')}"></div>

        <div class="col-md-10 p-4">

            <div th:replace="~{fragments/layout :: topbar(title='Add Category', subtitle='Create a new expense category', user=${loggedInUser})}"></div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="bi bi-tag me-2"></i>Add Category</h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/save-category}" th:object="${category}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="e.g. Groceries, Travel, Rent">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-1"></i>Save Category
                        </button>
                        <a href="/categories-page" class="btn btn-secondary">Cancel</a>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
