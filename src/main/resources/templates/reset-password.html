<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker - Reset Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body{
    background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
    min-height: 100vh;
}
.login-box{
    width:400px;
    margin:80px auto;
    padding:35px;
    background:white;
    border-radius:16px;
    box-shadow:0 1rem 3rem rgba(0,0,0,.25);
}
</style>
</head>

<body>

<div class="login-box">

<div class="text-center mb-4">
    <i class="bi bi-shield-lock fs-1 text-primary"></i>
    <h2 class="mt-2">Reset Password</h2>
    <p class="text-muted">Enter the OTP sent to your email and choose a new password</p>
</div>

<div th:if="${error}" class="alert alert-danger py-2">
    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
</div>
<div th:if="${success}" class="alert alert-success py-2">
    <i class="bi bi-check-circle me-1"></i><span th:text="${success}"></span>
</div>

<form action="/reset-password" method="post">

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" th:value="${email}" placeholder="Enter your registered email" required>
</div>

<div class="mb-3">
<label class="form-label">OTP</label>
<input type="text" name="otp" class="form-control" placeholder="6-digit OTP" maxlength="6" pattern="[0-9]{6}" required autofocus>
</div>

<div class="mb-3">
<label class="form-label">New Password</label>
<input type="password" name="newPassword" class="form-control" placeholder="At least 6 characters" minlength="6" required>
</div>

<div class="mb-3">
<label class="form-label">Confirm New Password</label>
<input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter new password" minlength="6" required>
</div>

<button type="submit" class="btn btn-primary w-100">
<i class="bi bi-check-circle me-1"></i> Reset Password
</button>

</form>

<br>

<p class="text-center mb-0">
Didn't get an OTP?
<a href="/forgot-password">Request again</a>
</p>

</div>

</body>
</html>
