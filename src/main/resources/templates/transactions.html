<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Transactions</title>
<th:block th:insert="~{fragments/layout :: headAssets}"></th:block>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <div th:replace="~{fragments/layout :: sidebar(active='transactions')}"></div>

        <div class="col-md-10 p-4">

            <div th:replace="~{fragments/layout :: topbar(title='Online Transactions', subtitle='Payments received from your online/UPI transaction provider', user=${loggedInUser})}"></div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Simulate a test transaction (no real payment provider connected for this demo) -->
            <div class="card shadow-sm border-0 rounded-4 mb-4" th:if="${testEndpointEnabled}">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-cash-coin me-2"></i>Simulate a Test Transaction</h5>
                    <small class="text-muted">No real UPI/payment provider is connected - this submits through the same processing logic a real provider webhook would use.</small>
                </div>
                <div class="card-body">
                    <form action="/transactions/test-submit" method="post" class="row g-3 align-items-end">

                        <div class="col-md-2">
                            <label class="form-label">Transaction ID</label>
                            <input type="text" name="transactionId" class="form-control" placeholder="Auto-generated if blank">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Amount (₹)</label>
                            <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Merchant</label>
                            <input type="text" name="merchant" class="form-control" placeholder="e.g. Amazon">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Payment Method</label>
                            <select name="paymentMethod" class="form-select" required>
                                <option th:each="pm : ${paymentMethods}" th:value="${pm}" th:text="${pm}"></option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-send me-1"></i>Submit
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body">

                    <div th:if="${#lists.isEmpty(transactions)}" class="text-center text-muted py-5">
                        <i class="bi bi-credit-card fs-1"></i>
                        <p class="mt-2 mb-0">No online transactions recorded yet.</p>
                    </div>

                    <table th:unless="${#lists.isEmpty(transactions)}" class="table table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>Transaction ID</th>
                                <th>Merchant</th>
                                <th>Amount</th>
                                <th>Payment Method</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="txn : ${transactions}">
                                <td><code th:text="${txn.externalTransactionId}"></code></td>
                                <td th:text="${txn.merchant != null ? txn.merchant : '—'}"></td>
                                <td>₹<span th:text="${#numbers.formatDecimal(txn.amount,1,2)}"></span></td>
                                <td><span class="badge bg-info text-dark" th:text="${txn.paymentMethod}"></span></td>
                                <td th:text="${#temporals.format(txn.transactionDate, 'dd MMM yyyy, hh:mm a')}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${txn.status.name() == 'SUCCESS'} ? 'bg-success' : (${txn.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                                          th:text="${txn.status}"></span>
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
