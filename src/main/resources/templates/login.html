<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body{
    background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
    min-height: 100vh;
}
.login-box{
    width:400px;
    margin:100px auto;
    padding:35px;
    background:white;
    border-radius:16px;
    box-shadow:0 1rem 3rem rgba(0,0,0,.25);
}
</style>
</head>

<body>

<div class="login-box">

<div class="text-center mb-4">
    <i class="bi bi-wallet2 fs-1 text-primary"></i>
    <h2 class="mt-2">Expense Tracker</h2>
    <p class="text-muted">Sign in to manage your expenses</p>
</div>

<div th:if="${error}" class="alert alert-danger py-2">
    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
</div>
<div th:if="${success}" class="alert alert-success py-2">
    <i class="bi bi-check-circle me-1"></i><span th:text="${success}"></span>
</div>

<form action="/login" method="post">

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" placeholder="Enter Email" required autofocus>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" placeholder="Enter Password" required>
<div class="text-end mt-1">
    <a href="/forgot-password" class="small">Forgot password?</a>
</div>
</div>

<button type="submit" class="btn btn-primary w-100">
<i class="bi bi-box-arrow-in-right me-1"></i> Login
</button>

</form>

<br>

<p class="text-center mb-0">
Don't have an account?
<a href="/register">Register</a>
</p>

</div>

</body>
</html>
