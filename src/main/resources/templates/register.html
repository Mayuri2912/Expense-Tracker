<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Expense Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
    min-height: 100vh;
}
.register-box{
    width:460px;
    margin:50px auto;
    padding:35px;
    background:white;
    border-radius:16px;
    box-shadow:0 1rem 3rem rgba(0,0,0,.25);
}
</style>

</head>

<body>

<div class="register-box">

<div class="text-center mb-4">
    <i class="bi bi-person-plus fs-1 text-primary"></i>
    <h2 class="mt-2">Create Account</h2>
    <p class="text-muted">Start tracking your expenses today</p>
</div>

<div th:if="${error}" class="alert alert-danger py-2">
    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
</div>

<form th:action="@{/register}" th:object="${user}" method="post">

<div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" class="form-control" th:field="*{fullName}"
           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
           placeholder="Enter Full Name">
    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
</div>

<div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" th:field="*{email}"
           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
           placeholder="Enter Email">
    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
</div>

<div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" th:field="*{password}"
           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
           placeholder="Enter Password">
    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    <div class="form-text">Minimum 6 characters.</div>
</div>

<div class="mb-3">
    <label class="form-label">Confirm Password</label>
    <input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter Password" required>
</div>

<button type="submit" class="btn btn-success w-100">
    <i class="bi bi-check-circle me-1"></i> Register
</button>

</form>

<br>

<p class="text-center mb-0">
Already have an account?
<a href="/login">Login</a>
</p>

</div>

</body>
</html>
