<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Error - Expense Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>body{ background:#f4f6f9; }</style>
</head>
<body>

<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="text-center">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size:4rem"></i>
        <h2 class="mt-3" th:text="${errorTitle}">Something Went Wrong</h2>
        <p class="text-muted" th:text="${errorMessage}">An unexpected error occurred.</p>
        <a href="/dashboard" class="btn btn-primary mt-2">
            <i class="bi bi-house me-1"></i>Back to Dashboard
        </a>
    </div>
</div>

</body>
</html>
