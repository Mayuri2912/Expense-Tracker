spring.application.name=ExpenseTracker

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Application info (shown on the Settings page) ----
application.version=1.0.0

# ---- Server ----
server.error.include-message=always

# ---- Email (Forgot Password OTP, notifications) ----
# Set these via environment variables (or override in application.properties)
# before the feature can actually send email. Gmail example: use an "app
# password", not your normal account password (Google account -> Security ->
# App Passwords). Any standard SMTP provider works the same way.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# How long a password-reset OTP stays valid, in minutes.
app.otp.expiry-minutes=10

# ---- Online Transaction Monitoring (test/demo feature) ----
# POST /api/transactions/webhook simulates what a real payment-provider
# webhook would deliver; no real UPI/payment provider is connected. Set to
# false (or TRANSACTION_TEST_ENDPOINT_ENABLED=false) to disable the manual
# test-transaction endpoint/form (POST /api/transactions/test) in an
# environment where it shouldn't be reachable.
app.transactions.test-endpoint-enabled=${TRANSACTION_TEST_ENDPOINT_ENABLED:true}
