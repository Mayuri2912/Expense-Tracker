spring.application.name=ExpenseTracker

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Application info (shown on the Settings page) ----
application.version=1.0.0

# ---- Server ----
server.error.include-message=always

# ---- Email (Forgot Password OTP, notifications) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# How long a password-reset OTP stays valid, in minutes.
app.otp.expiry-minutes=10

# ---- Gemini AI API Configuration ----
gemini.api.key=${GEMINI_API_KEY:your_actual_gemini_api_key}